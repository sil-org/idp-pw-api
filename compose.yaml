x-db_healthcheck: &db_healthcheck
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    start_period: 10s
    interval: 10s
    timeout: 5s
    retries: 3

x-mysql_env: &mysql_env
  MYSQL_DATABASE: "db"
  MYSQL_USER: "user"
  MYSQL_PASSWORD: "pass"
  MYSQL_ROOT_PASSWORD: "pass"

services:

  api:
    build: ./
    volumes:
      - ./application:/data
    ports:
      - "51155:80"
    env_file:
      - ./common.env
      - path: ./local.env
        required: false

  apitest:
    build: ./
    volumes:
      - ./application:/data
    depends_on:
      zxcvbn:
        condition: service_started
      broker:
        condition: service_healthy
    env_file:
      - ./common.env
      - ./test.env
    environment:
      APP_ENV: test
      ID_BROKER_baseUrl: http://broker
      COMPOSER_ROOT_VERSION: dev-local
      TRUSTED_ORIGINS: https://localhost,http://localhost
    command: ["/data/run-tests-api.sh"]

  unittest:
    build: ./
    volumes:
      - ./application:/data
    depends_on:
      zxcvbn:
        condition: service_started
    env_file:
      - ./common.env
      - ./test.env
    environment:
      APP_ENV: test
      ID_BROKER_baseUrl: http://broker
      COMPOSER_ROOT_VERSION: dev-local
    command: ["/data/run-tests.sh"]

  integrationtest:
    build: ./
    volumes:
      - ./application:/data
    depends_on:
      zxcvbn:
        condition: service_started
    env_file:
      - ./common.env
      - ./test.env
      - path: ./local.env
        required: false
    environment:
      APP_ENV: test
      ID_BROKER_baseUrl: http://broker
    command: ["/data/run-tests-integration.sh"]

  cli:
    build: ./
    volumes:
      - ./application:/data
      - composer-cache:/composer
    working_dir: /data
    environment:
      COMPOSER_CACHE_DIR: /composer
      COMPOSER_ROOT_VERSION: dev-local
    env_file:
      - ./common.env
      - path: ./local.env
        required: false
    command: ["true"]

  zxcvbn:
    image: wcjr/zxcvbn-api:1.1.0
    platform: linux/amd64

  broker-db:
    image: mariadb:10
    environment: *mysql_env
    <<: *db_healthcheck

  adminer:
    image: adminer
    ports:
      - '51158:8080'
    environment:
      ADMINER_DEFAULT_SERVER: 'broker-db'

  broker:
    image: ghcr.io/sil-org/idp-id-broker:8
    platform: linux/amd64
    ports:
      - "51154:80"
    depends_on:
      broker-db:
        condition: service_healthy
    volumes:
      - ./dockerbuild/broker/m381901_235959_insert_test_data.php:/app/console/migrations/m381901_235959_insert_test_data.php
      - ./dockerbuild/broker/User.php:/app/console/migrations/User.php
      - ./dockerbuild/broker/Method.php:/app/console/migrations/Method.php
      - ./dockerbuild/broker/Reset.php:/app/console/migrations/Reset.php
    environment:
      EMAILER_CLASS: \Sil\SilIdBroker\Behat\Context\fakes\FakeEmailer
      IDP_NAME: idp1
      MYSQL_HOST: broker-db
      <<: *mysql_env
      API_ACCESS_KEYS: abc123
      HELP_CENTER_URL: https://example.com/#/help
      PASSWORD_FORGOT_URL: https://example.com/#/forgot
      PASSWORD_PROFILE_URL: https://example.com/#/profile
      SUPPORT_EMAIL: support@example.com
      EMAIL_SIGNATURE: Dummy Signature for Tests
      APP_ENV: test
      MFA_TOTP_apiBaseUrl: https://example.com/
      MFA_WEBAUTHN_apiBaseUrl: https://example.com/
      MFA_API_KEY: not_needed_here
      MFA_API_SECRET: not_needed_here
    healthcheck:
      test: curl --connect-timeout 5 http://localhost:80/site/status
      start_period: 1s
      interval: 1s
      timeout: 5s
      retries: 20

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.20.31.0/24
          gateway: 10.20.31.1

volumes:
  composer-cache:
